name: Continuous Integration

# Pull requests are checked before they land. Without pull_request, forks cannot
# be checked before merge, since pushes from forks do not trigger workflows here.
# Documentation is part of the API contract (AGENTS.md §4), so it cannot be
# skipped. Trade-off: a PR from a branch of this repository runs the workflow
# twice, once on the branch head and once on the merge commit, because concurrency
# keys off github.ref and both commits have different refs.
on:
  push:
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref, but never on main: the Deployment
# workflow keys off a *completed* CI run, and cancelling one would drop the
# publish for that commit on the floor.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Must run before setup-node: `cache: pnpm` needs the pnpm binary to
      # resolve the store path. The version comes from the `packageManager`
      # field in package.json — do not pin it here as well.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build, typecheck, test and lint
        run: pnpm run ci

  e2e:
    name: Run the e2e test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run e2e tests
        run: pnpm exec turbo run test --filter=shadow-objects-e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/shadow-objects-e2e/playwright-report/
          retention-days: 7
