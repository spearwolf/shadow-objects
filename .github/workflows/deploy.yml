name: Deployment

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [main]

# npm trusted publishing (OIDC): the runner mints a short-lived id-token that npm
# exchanges for a publish credential. No NPM_TOKEN secret is involved.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Publish all NPM Packages
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@spearwolf'

      - uses: pnpm/action-setup@v6
        with:
          run_install: true

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm today,
      # but the publish must not degrade into an ENEEDAUTH if that ever regresses.
      - name: Ensure npm supports trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if ! printf '11.5.1\n%s\n' "$version" | sort -C -V; then
            echo "npm $version is older than the required 11.5.1, upgrading"
            npm install -g npm@latest
            npm --version
          fi

      - name: Publish packages
        run: pnpm run publishNpmPkg
