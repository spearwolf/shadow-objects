name: Deployment

# This workflow must keep its filename. npm trusted publishing matches the
# OIDC claim against the exact workflow file registered for the package, and
# it validates the *calling* workflow — so the publish step can never move
# into a reusable workflow invoked from ci.yml.
on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [main]

# npm trusted publishing (OIDC): the runner mints a short-lived id-token that npm
# exchanges for a publish credential. No NPM_TOKEN secret is involved.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Publish all NPM Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `conclusion` covers every job in the CI workflow, so both the build/test
    # job and the e2e job have to be green. The `event` guard keeps anything
    # other than a branch push from reaching the registry.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}
    steps:
      # Pin the checkout to the commit CI actually validated. Without `ref`,
      # a workflow_run checkout resolves to the default branch HEAD, which by
      # then may already be a newer, untested commit.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@spearwolf'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm today,
      # but the publish must not degrade into an ENEEDAUTH if that ever regresses.
      - name: Ensure npm supports trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if ! printf '11.5.1\n%s\n' "$version" | sort -C -V; then
            echo "npm $version is older than the required 11.5.1, upgrading"
            npm install -g npm@latest
            npm --version
          fi

      - name: Publish packages
        run: pnpm run publishNpmPkg
