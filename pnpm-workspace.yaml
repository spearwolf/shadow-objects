packages:
  - 'packages/*'

# vitest declares `vite: ^6 || ^7 || ^8` and would resolve 8.x on its own,
# independently of the catalog entry below. Vite 8 swapped esbuild for
# Rolldown/Oxc, and Oxc does not lower native decorators yet ("waiting for the
# specification to progress" — Vite 8 migration guide). `src/in-the-dark/
# SignalsPath.ts` and `src/view/ShadowEnv.ts` use `@signal ... accessor`, so
# their transformed output reaches node unlowered and dies with
# `SyntaxError: Invalid or unexpected token`. This override keeps every vite in
# the workspace on 7.x. Drop it once Oxc lowers decorators.
overrides:
  vite: ^7.3.6

# pnpm >=11 refuses dependency build scripts unless they are listed here
# (`strictDepBuilds` is on by default). esbuild's postinstall fetches the
# platform-specific binary — without it there is no compiler.
allowBuilds:
  esbuild: true

# Single source of truth for dependency versions.
# Reference from package.json with `"<dep>": "catalog:"`.
catalog:
  # --- runtime deps (shipped) ---
  # eventize and signalize move as a pair: signalize 1.0 declares
  # `peerDependencies: {"@spearwolf/eventize": "^6.0.0"}`. Both marker symbols
  # (`Symbol.for('eventize')`, the `@spearwolf/signalize/` keys) are realm-wide,
  # so two majors of either in one tree share a slot and throw at the boundary.
  # Keep the ranges pinned to one major each and check `pnpm why` after a bump.
  '@spearwolf/eventize': ^6.0.0
  '@spearwolf/signalize': 1.0.0-beta.0
  three: ^0.185.1

  # --- typescript ---
  typescript: ^7.0.2
  tslib: ^2.8.1

  # --- build ---
  esbuild: ^0.28.2
  esbuild-plugin-inline-worker: ^0.1.1

  # --- test ---
  # The four vitest entries move as one version and are exact on purpose.
  # Each satellite declares `peerDependencies: {vitest: "4.1.10"}`. vitest
  # names `@vitest/browser-playwright` and `@vitest/coverage-v8` back as
  # optional peers at that same exact version, but not `@vitest/browser` —
  # that one is tied in from the side instead: `@vitest/browser-playwright`
  # depends on it hard as `"@vitest/browser": "4.1.10"`, and
  # `@vitest/coverage-v8` names it as an optional peer at the same exact
  # version. With a caret range, a fresh resolution splits the group over
  # two patch releases: pnpm links a peer that is out of range and only
  # reports it as unmet, so vitest's bare `import('@vitest/coverage-v8')`
  # still resolves — one patch away from the internals it runs against, with
  # `@vitest/utils` in the tree twice. Bump all four together.
  vitest: 4.1.10
  '@vitest/browser': 4.1.10
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-v8': 4.1.10
  happy-dom: ^20.11.2
  sinon: ^22.1.0
  '@types/sinon': ^22.0.0
  lit-html: ^3.3.3
  # Pinned exact: 4.3.4-fix.0 is a prerelease tag above 4.3.4, and a caret range
  # against 4.3.4 would not resolve to a prerelease on its own — the exact
  # version is the only way to land on this particular fix build.
  '@esm-bundle/chai': 4.3.4-fix.0

  # Used by scripts/mergeCoverage.mjs. Ranges match what @vitest/coverage-v8@4.1.10
  # itself declares, so install resolves to the copies already in the tree instead
  # of adding a second version next to them.
  istanbul-lib-coverage: ^3.2.2
  istanbul-lib-report: ^3.0.1
  istanbul-reports: ^3.2.0

  # --- e2e ---
  '@playwright/test': ^1.62.1
  playwright: ^1.62.1
  # Held at 7.x on purpose — see the `overrides` block at the top of this file.
  vite: ^7.3.6

  # --- lint/format ---
  '@biomejs/biome': ^2.5.9

  # --- types ---
  # Pinned to the 24.x line to match `engines.node` (>=24.13.0) — the type
  # surface must not describe APIs the supported runtime does not have.
  '@types/node': ^24.10.12

  # --- monorepo orchestrator ---
  # Deliberately one patch behind latest: `minimumReleaseAge` (1 day, pnpm >=11
  # default) holds back releases younger than that. Pinning the newest patch
  # would force a `minimumReleaseAgeExclude` entry that rots within a day.
  turbo: ^2.10.11

  # --- demo (shae-offscreen-canvas) ---
  # The GUI panel on the package's demo page (index.html), not a test tool.
  lil-gui: ^0.21.0

  # --- misc ---
  rimraf: ^6.1.3
  leasot: ^14.4.0

# Named catalogs for ranges that are not install pins. A peer range names
# the floor a consumer is held to, and it has to stay wider than the pin
# the workspace itself installs — the consumer resolves `three` on its own,
# and only one copy of it may stand in a dependency tree.
catalogs:
  peer:
    three: '>=0.180.0'

# `minimumReleaseAge` (1 day, pnpm >=11 default) exists to keep a freshly
# compromised third-party release out of the tree. The @spearwolf packages are
# first-party — published from this account, reviewed here — so the cooling-off
# buys nothing and only blocks the install. Written by pnpm on install; the
# entry is version-exact and can go once the release is a day old.
minimumReleaseAgeExclude:
  - '@spearwolf/signalize@1.0.0-beta.0'
