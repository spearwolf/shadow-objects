<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sync-failure</title>
  </head>
  <body>
    <!-- no `src`: the page imports the modules itself, so that the shadow objects are registered
         before the entities that need them reach the worker.

         `auto-sync="no"`: the page counts sync cycles, and a frame loop turning in the background
         would make that count worthless. It is explicitly not a guard against the change-driven
         sync — that one runs whatever this attribute says. -->
    <shae-worker id="worker0" auto-sync="no"></shae-worker>

    <section id="tests"></section>

    <script type="module" src="/src/sync-failure.js"></script>
  </body>
</html>
